<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion 2026 — ACID (aperçu live)</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #05070c;
        color: #e6edf3;
        font-family: Inter, system-ui, sans-serif;
        overflow: hidden;
      }
      #root { height: 100vh; }
      .app { display: flex; height: 100vh; }
      .side {
        width: 340px;
        flex: 0 0 340px;
        padding: 22px 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.07);
        overflow-y: auto;
      }
      .brand { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
      .sub {
        font-size: 12px;
        color: #6b7a8d;
        font-family: 'JetBrains Mono', monospace;
        margin-top: 6px;
        line-height: 1.5;
      }
      .group { margin-top: 22px; }
      .group-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #6b7a8d;
        margin-bottom: 10px;
      }
      button.deck {
        display: block;
        width: 100%;
        text-align: left;
        padding: 11px 13px;
        margin-bottom: 7px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.035);
        color: #e6edf3;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button.deck:hover { border-color: rgba(52, 211, 153, 0.45); transform: translateY(-1px); }
      button.deck.active {
        background: rgba(52, 211, 153, 0.12);
        border-color: rgba(52, 211, 153, 0.6);
        box-shadow: 0 0 30px rgba(52, 211, 153, 0.18);
      }
      .deck small { display: block; font-weight: 500; color: #6b7a8d; font-size: 11px; margin-top: 3px; font-family: 'JetBrains Mono', monospace; }
      .stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 26px; padding: 18px; }
      .phone {
        height: calc(100vh - 36px);
        aspect-ratio: 9 / 16;
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 40px 120px -30px rgba(0, 0, 0, 0.9);
        background: #0b0f19;
      }
      .meta { max-width: 320px; font-size: 12.5px; line-height: 1.65; color: #9ba7b4; }
      .meta code { font-family: 'JetBrains Mono', monospace; color: #34d399; font-size: 11.5px; }
      .pill {
        display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px;
        font-family: 'JetBrains Mono', monospace; border: 1px solid rgba(255,255,255,0.14);
        color: #9ba7b4; margin: 0 6px 6px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/preview/main.tsx"></script>
  </body>
</html>
